# Supabase configuration file for local development
# Documentation: https://supabase.com/docs/guides/cli/config

project_id = "neet-2027-future-score"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000", "http://localhost:5173"]
jwt_expiry = 3600
enable_signup = false # No public admin signup as required

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[functions.lead-alert]
verify_jwt = true
